name: Repository Sync

on:
  # Monitor for changes every 5 minutes (frequent enough to catch pushes quickly)
  schedule:
    - cron: '*/5 * * * *'
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      force_sync_all:
        description: 'Force sync all repositories (ignore last sync check)'
        required: false
        default: false
        type: boolean

env:
  SOURCE_USER: ${{ vars.SOURCE_USER }}
  TARGET_ORG: ${{ vars.TARGET_ORG }}
  SOURCE_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
  TARGET_TOKEN: ${{ secrets.TARGET_GITHUB_TOKEN }}
  ICP21_TOKEN: ${{ secrets.ICP21_GITHUB_TOKEN }}
  ESPRESSO21_TOKEN: ${{ secrets.ESPRESSO21_GITHUB_TOKEN }}

jobs:
  sync-repos:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: npm install @octokit/rest
    
    - name: Sync repositories
      run: |
        cat > sync-repositories.js << 'EOF'
        const { Octokit } = require('@octokit/rest');
        const { execSync } = require('child_process');
        const fs = require('fs');

        const sourceUser = process.env.SOURCE_USER;
        const targetOrg = process.env.TARGET_ORG;
        const sourceToken = process.env.SOURCE_TOKEN;
        const targetToken = process.env.TARGET_TOKEN;
        const icp21Token = process.env.ICP21_TOKEN;
        const espresso21Token = process.env.ESPRESSO21_TOKEN;
        const forceSync = process.env.FORCE_SYNC === 'true';

        if (!sourceUser || !sourceToken) {
          console.error('❌ Missing required SOURCE_USER or SOURCE_TOKEN environment variables');
          process.exit(1);
        }

        // Organization mapping based on topics
        const orgMapping = {
          'icp21': { org: 'icp21', token: icp21Token },
          'espresso21': { org: 'espresso21', token: espresso21Token }
        };

        // Fallback to default target org if available
        if (targetOrg && targetToken) {
          orgMapping.default = { org: targetOrg, token: targetToken };
        }

        const sourceOctokit = new Octokit({ auth: sourceToken });

        // Store last sync times to detect changes
        const SYNC_STATE_FILE = 'last-sync-state.json';
        
        function loadSyncState() {
          try {
            if (fs.existsSync(SYNC_STATE_FILE)) {
              return JSON.parse(fs.readFileSync(SYNC_STATE_FILE, 'utf8'));
            }
          } catch (error) {
            console.log('⚠️ Could not load sync state, treating as first run');
          }
          return {};
        }
        
        function saveSyncState(state) {
          try {
            fs.writeFileSync(SYNC_STATE_FILE, JSON.stringify(state, null, 2));
          } catch (error) {
            console.log('⚠️ Could not save sync state');
          }
        }

        function determineTargetOrg(repoTopics) {
          // Check for organization-specific topics
          for (const topic of repoTopics) {
            if (orgMapping[topic] && orgMapping[topic].token) {
              return orgMapping[topic];
            }
          }
          
          // Fallback to default org if configured
          if (orgMapping.default) {
            return orgMapping.default;
          }
          
          return null;
        }

        async function getRepositoriesWithCodeSyncTopic() {
          console.log(`🔍 Fetching repositories with 'codesync' topic from ${sourceUser}...`);
          
          const repos = [];
          let page = 1;
          
          while (true) {
            const response = await sourceOctokit.repos.listForAuthenticatedUser({
              visibility: 'all',
              affiliation: 'owner',
              per_page: 100,
              page: page
            });
            
            if (response.data.length === 0) break;
            
            // Filter for repos with 'codesync' topic and not archived
            const filteredRepos = response.data.filter(repo => {
              const topics = repo.topics || [];
              const hasCodeSync = topics.includes('codesync');
              const hasTargetOrg = determineTargetOrg(topics) !== null;
              return hasCodeSync && hasTargetOrg && !repo.archived;
            });
            
            repos.push(...filteredRepos);
            page++;
          }
          
          console.log(`✅ Found ${repos.length} repositories with 'codesync' topic and valid target org`);
          return repos;
        }

        async function checkIfTargetRepoExists(repoName, targetOrgConfig) {
          try {
            const targetOctokit = new Octokit({ auth: targetOrgConfig.token });
            await targetOctokit.repos.get({
              owner: targetOrgConfig.org,
              repo: repoName
            });
            return true;
          } catch (error) {
            if (error.status === 404) return false;
            throw error;
          }
        }

        async function createTargetRepo(sourceRepo, targetOrgConfig) {
          console.log(`🏗️ Creating repository ${sourceRepo.name} in ${targetOrgConfig.org}...`);
          
          try {
            const targetOctokit = new Octokit({ auth: targetOrgConfig.token });
            await targetOctokit.repos.createInOrg({
              org: targetOrgConfig.org,
              name: sourceRepo.name,
              description: sourceRepo.description || '',
              private: sourceRepo.private,
              has_issues: sourceRepo.has_issues,
              has_projects: sourceRepo.has_projects,
              has_wiki: sourceRepo.has_wiki,
              auto_init: false
            });
            
            console.log(`✅ Created repository ${sourceRepo.name} in ${targetOrgConfig.org}`);
            // Wait for repository to be fully created
            await new Promise(resolve => setTimeout(resolve, 3000));
            return true;
          } catch (error) {
            console.error(`❌ Failed to create repository ${sourceRepo.name} in ${targetOrgConfig.org}:`, error.message);
            return false;
          }
        }

        async function syncRepository(sourceRepo, targetOrgConfig, lastSyncTime) {
          const repoName = sourceRepo.name;
          
          // Check if repo has been updated since last sync (unless forced)
          if (!forceSync && lastSyncTime) {
            const lastPush = new Date(sourceRepo.pushed_at);
            const lastSync = new Date(lastSyncTime);
            
            if (lastPush <= lastSync) {
              console.log(`⏭️ Skipping ${repoName} - no changes since last sync`);
              return { success: true, skipped: true };
            }
          }
          
          const sourceUrl = `https://x-access-token:${sourceToken}@github.com/${sourceUser}/${repoName}.git`;
          const targetUrl = `https://x-access-token:${targetOrgConfig.token}@github.com/${targetOrgConfig.org}/${repoName}.git`;
          
          console.log(`🔄 Syncing repository: ${repoName} to ${targetOrgConfig.org}`);
          
          try {
            // Clone source repository
            console.log('📥 Cloning source repository...');
            execSync(`git clone ${sourceUrl} ${repoName}`, { 
              stdio: 'pipe',
              timeout: 300000 
            });
            
            // Check if repository has commits
            try {
              execSync(`cd ${repoName} && git rev-parse HEAD`, { stdio: 'pipe' });
            } catch (error) {
              console.log('⚠️ Repository is empty, skipping sync');
              execSync(`rm -rf ${repoName}`);
              return { success: true, skipped: true };
            }
            
            // Configure git
            execSync(`cd ${repoName} && git config user.name "Repository Sync Bot"`, { stdio: 'pipe' });
            execSync(`cd ${repoName} && git config user.email "sync-bot@github.com"`, { stdio: 'pipe' });
            
            // Add target as remote
            execSync(`cd ${repoName} && git remote add target ${targetUrl}`, { stdio: 'pipe' });
            
            // Fetch existing branches from target
            try {
              execSync(`cd ${repoName} && git fetch target`, { stdio: 'pipe' });
            } catch (fetchError) {
              console.log('📝 Target repository is empty');
            }
            
            // Create/switch to codesync branch
            const defaultBranch = sourceRepo.default_branch || 'main';
            try {
              // Try to checkout existing codesync branch from target
              try {
                execSync(`cd ${repoName} && git checkout -b codesync target/codesync`, { stdio: 'pipe' });
                console.log('📝 Using existing codesync branch');
              } catch (remoteError) {
                // Create new codesync branch from default branch
                execSync(`cd ${repoName} && git checkout -b codesync`, { stdio: 'pipe' });
                console.log('🆕 Created new codesync branch');
              }
              
              // Merge latest changes from default branch
              execSync(`cd ${repoName} && git checkout ${defaultBranch}`, { stdio: 'pipe' });
              execSync(`cd ${repoName} && git checkout codesync`, { stdio: 'pipe' });
              
              // Check for differences and merge if needed
              try {
                execSync(`cd ${repoName} && git diff --quiet codesync ${defaultBranch}`, { stdio: 'pipe' });
                console.log('📝 codesync branch is up to date');
              } catch (diffError) {
                execSync(`cd ${repoName} && git merge ${defaultBranch} --no-edit`, { stdio: 'pipe' });
                console.log('🔀 Merged latest changes into codesync');
              }
            } catch (branchError) {
              throw new Error(`Branch management failed: ${branchError.message}`);
            }
            
            // Push to target repository
            console.log(`📤 Pushing to target repository in ${targetOrgConfig.org}...`);
            try {
              execSync(`cd ${repoName} && git push target codesync`, { 
                stdio: 'pipe',
                timeout: 300000 
              });
              console.log(`✅ Successfully synced ${repoName} to ${targetOrgConfig.org}`);
            } catch (pushError) {
              // Try force push with lease
              console.log('🔄 Retrying with force-with-lease...');
              execSync(`cd ${repoName} && git push --force-with-lease target codesync`, { 
                stdio: 'pipe',
                timeout: 300000 
              });
              console.log(`✅ Force-synced ${repoName} to ${targetOrgConfig.org}`);
            }
            
            // Cleanup
            execSync(`rm -rf ${repoName}`);
            return { success: true, skipped: false };
            
          } catch (error) {
            console.error(`❌ Failed to sync ${repoName} to ${targetOrgConfig.org}:`, error.message);
            // Cleanup on failure
            try {
              execSync(`rm -rf ${repoName}`);
            } catch (cleanupError) {
              // Ignore cleanup errors
            }
            return { success: false, skipped: false };
          }
        }

        async function main() {
          console.log('🚀 Starting repository sync...');
          console.log(`📂 Source: ${sourceUser}`);
          console.log(`🔄 Force sync: ${forceSync}`);
          
          // Display available organizations
          const availableOrgs = Object.keys(orgMapping).filter(key => key !== 'default' && orgMapping[key].token);
          if (orgMapping.default) {
            availableOrgs.push(`default (${orgMapping.default.org})`);
          }
          console.log(`🏢 Available target orgs: ${availableOrgs.join(', ')}`);
          
          const syncState = loadSyncState();
          const currentTime = new Date().toISOString();
          
          try {
            const repos = await getRepositoriesWithCodeSyncTopic();
            
            if (repos.length === 0) {
              console.log('ℹ️ No repositories found with "codesync" topic and valid target organization');
              console.log('💡 To sync a repository, add the "codesync" topic plus one of: icp21, espresso21');
              console.log('💡 Or configure default TARGET_ORG and TARGET_GITHUB_TOKEN for fallback');
              return;
            }
            
            const results = {
              total: repos.length,
              synced: 0,
              skipped: 0,
              created: 0,
              failed: 0,
              byOrg: {}
            };
            
            for (const repo of repos) {
              console.log(`\n--- Processing ${repo.name} ---`);
              
              // Determine target organization
              const targetOrgConfig = determineTargetOrg(repo.topics || []);
              if (!targetOrgConfig) {
                console.log(`❌ No valid target organization found for ${repo.name}`);
                results.failed++;
                continue;
              }
              
              console.log(`🎯 Target organization: ${targetOrgConfig.org}`);
              
              // Initialize org stats if needed
              if (!results.byOrg[targetOrgConfig.org]) {
                results.byOrg[targetOrgConfig.org] = { synced: 0, created: 0, skipped: 0, failed: 0 };
              }
              
              // Check if target repository exists
              const exists = await checkIfTargetRepoExists(repo.name, targetOrgConfig);
              
              if (!exists) {
                const created = await createTargetRepo(repo, targetOrgConfig);
                if (created) {
                  results.created++;
                  results.byOrg[targetOrgConfig.org].created++;
                } else {
                  results.failed++;
                  results.byOrg[targetOrgConfig.org].failed++;
                  continue;
                }
              }
              
              // Sync the repository
              const syncKey = `${targetOrgConfig.org}/${repo.name}`;
              const lastSync = syncState[syncKey]?.lastSync;
              const result = await syncRepository(repo, targetOrgConfig, lastSync);
              
              if (result.success) {
                if (result.skipped) {
                  results.skipped++;
                  results.byOrg[targetOrgConfig.org].skipped++;
                } else {
                  results.synced++;
                  results.byOrg[targetOrgConfig.org].synced++;
                  // Update sync state with org-specific key
                  syncState[syncKey] = {
                    lastSync: currentTime,
                    lastPush: repo.pushed_at,
                    targetOrg: targetOrgConfig.org
                  };
                }
              } else {
                results.failed++;
                results.byOrg[targetOrgConfig.org].failed++;
              }
            }
            
            // Save updated sync state
            saveSyncState(syncState);
            
            console.log('\n📊 === SYNC SUMMARY ===');
            console.log(`📁 Total repositories: ${results.total}`);
            console.log(`🆕 Created: ${results.created}`);
            console.log(`🔄 Synced: ${results.synced}`);
            console.log(`⏭️ Skipped (no changes): ${results.skipped}`);
            console.log(`❌ Failed: ${results.failed}`);
            
            // Per-organization breakdown
            console.log('\n📊 === BY ORGANIZATION ===');
            for (const [org, stats] of Object.entries(results.byOrg)) {
              console.log(`🏢 ${org}: created=${stats.created}, synced=${stats.synced}, skipped=${stats.skipped}, failed=${stats.failed}`);
            }
            
            if (results.failed > 0) {
              console.log('\n⚠️ Some repositories failed to sync. Check the logs above.');
              process.exit(1);
            }
            
            if (results.synced > 0) {
              console.log('\n✅ Sync completed successfully!');
              console.log('📋 Review the "codesync" branches in your target repositories');
            } else if (results.skipped === results.total) {
              console.log('\n✅ All repositories are up to date!');
            }
            
          } catch (error) {
            console.error('💥 Sync failed:', error.message);
            process.exit(1);
          }
        }

        main();
        EOF
        
        FORCE_SYNC="${{ github.event.inputs.force_sync_all }}" node sync-repositories.js
      
    - name: Cleanup
      if: always()
      run: |
        rm -f sync-repositories.js
        rm -f last-sync-state.json
        rm -rf *.git
        rm -rf */